<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tab icon is the NXT wordmark, cut from logo-color.png. There is no vector
       master, so these are hand-tuned PNGs at each size rather than one SVG
       the browser would downscale badly. apple-touch-icon must be PNG anyway. -->
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#182C64" />
  <meta name="author" content="NXT" />

  <!-- Defaults for `vite dev` only. scripts/prerender.mjs strips these two and
       replaces the marker below with the real per-route title, description,
       canonical, Open Graph, Twitter card and JSON-LD. -->
  <title>NXT | Digital Wallet, Instant Transfers & Credit Cards</title>
  <meta name="description" content="Send money by location or QR, split bills, top up in seconds and check your balance without logging in." />
  <!--app-head-->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
